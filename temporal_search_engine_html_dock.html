<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title id="tab_title">Temporal SE HTML Dock |</title>
    <script>
        // get requested archived webpage from bucket and fill in relevant information
        // in tab title, date of archived webpage, link of archived page, ...
        function get_request() {
            const params = new URLSearchParams(window.location.search);
            const archived_page = params.get('dock');
            console.log(archived_page)
            // get iframe and place source
            document.getElementById('archive_dock').src = archived_page;
        }
    </script>
    <style>
        a {
            text-decoration: none;
            color: inherit;
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        h2, h3 {
            padding: 20px;
        }
        .top_bar {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: #667483;
            color: black;
            line-height: 50px;
            z-index: 10;
            justify-content: flex-start;
            align-items: center;
            /*border-bottom-left-radius: 20px;*/
            /*border-bottom-right-radius: 20px;*/
        }
        .bottom_bar {
            display: flex;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: #667483;
            color: black;
            text-align: center;
            line-height: 50px;
            z-index: 10;
            justify-content: center;
            align-items: center;
            /*border-top-left-radius: 20px;*/
            /*border-top-right-radius: 20px;*/
        }
        .content_container {
            flex: 1;
            overflow: hidden;
            padding-top: 50px;  /* Prevents top bar from covering content */
            padding-bottom: 50px; /* Prevents bottom bar from covering content */
        }
        .overlay_frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body onload="get_request()">
    <div class="top_bar">
        <!--could add title of archived page here-->
        <h2>
            <a href="temporal_search_engine_home.html" target="_self">TSE</a>
        </h2>
    </div>
    <div class="content_container">
        <!--src would be stored html-->
        <iframe id="archive_dock" class="overlay_frame" src=""></iframe>
    </div>
    <!--    Bottom Bar:
        would contain relevant information, probably link to active webpage
        and date of the stored html, could have future integration
        to allow choosing different archived dates of the webpage
    -->
    <div class="bottom_bar">
        <h3>
            <a id="webpage_link" href="">webpage_link</a>
        </h3>
        <div><!--Meant To Provide Extra Spacing?--></div>
        <h3 id="date_of_archival">date_of_this_archival</h3>
    </div>
</body>
</html>
