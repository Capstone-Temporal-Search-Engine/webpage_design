<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Temporal SE HTML Dock |</title>
    <style>
        a {
            text-decoration: none;
            color: inherit;
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        h2 {
            padding: 20px;
        }
        .top_bar {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: #667483;
            color: black;
            line-height: 50px;
            z-index: 10;
            justify-content: flex-start;
            align-items: center;
            /*border-bottom-left-radius: 20px;*/
            /*border-bottom-right-radius: 20px;*/
        }
        .bottom_bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: #667483;
            color: black;
            text-align: center;
            line-height: 50px;
            z-index: 10;
            /*border-top-left-radius: 20px;*/
            /*border-top-right-radius: 20px;*/
        }
        .content_container {
            flex: 1;
            overflow: hidden;
            padding-top: 50px;  /* Prevents top bar from covering content */
            padding-bottom: 50px; /* Prevents bottom bar from covering content */
        }
        .overlay_frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="top_bar">
        <h2>
            <a href="temporal_search_engine_home.html" target="_self">TSE</a>
        </h2>
    </div>
    <div class="content_container">
        <!--src would be stored html-->
        <iframe class="overlay_frame" src="Grounded.html"></iframe>
    </div>
    <!--    Bottom Bar:
        would contain relevant information, probably link to active webpage
        and date of the stored html, could have future integration
        to allow choosing different archived dates of the webpage
    -->
    <div class="bottom_bar">Bottom Bar - Additional Info</div>
</body>
</html>
